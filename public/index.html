<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Honey Host</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Cpath d='M17 1.5l14 8v15l-14 8-14-8v-15z' fill='%23f5b50a'/%3E%3Cpath d='M17 9l7 4v8l-7 4-7-4v-8z' fill='%23b37d00'/%3E%3C/svg%3E">
