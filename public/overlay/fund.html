<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tree Host overlay: launch fund</title>
  <link rel="stylesheet" href="/overlay/overlay.css">
</head>
<body>
  <!-- OBS browser source: 760 x 300. The launch fund goal bar, and a pop-up for each new public backer. ?demo=1 -->
  <div class="fund glass">
    <div class="fund-row"><span class="fund-t"><span data-logo></span> <span id="title">Launch fund</span></span><span class="fund-n" id="count"></span></div>
    <div class="fund-amt"><b id="raised">$0</b><span id="target"></span></div>
    <div class="fund-bar"><div class="fund-fill" id="fill"></div></div>
    <div class="fund-cta">Back Tree Host: demo.treehost.online/donate · get a <b class="t-founder">★ FOUNDER</b> badge in-game</div>
  </div>
  <div class="backer glass hidden" id="backer"><span class="backer-ico">🎉</span><div><div class="backer-h" id="backer-h"></div><div class="backer-s" id="backer-s"></div></div></div>
  <script src="/overlay/fund.js"></script>
</body>
</html>
