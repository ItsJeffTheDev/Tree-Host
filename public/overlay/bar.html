<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tree Host overlay: bottom bar</title>
  <link rel="stylesheet" href="/overlay/overlay.css">
</head>
<body>
  <!-- OBS browser source: 1920 x 220 -->
  <div class="bar glass">
    <div class="brand"><span data-logo></span><div>Tree Host<small>Minecraft hosting</small></div></div>
    <div class="main">
      <div class="cta">Make your own Minecraft server <b>live, for free</b></div>
      <div class="link" data-o="link">Loading…</div>
      <div class="fine">Test site on a home PC, so servers may be slow · Servers reset in <b data-o="reset">…</b></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" data-o="servers">0</div><div class="l">servers</div></div>
      <div class="stat"><div class="n" data-o="running">0</div><div class="l">online</div></div>
      <div class="stat"><div class="n" data-o="players">0</div><div class="l">players</div></div>
    </div>
    <div><div class="qr" data-o="qr" data-size="110"></div><div class="qr-cap">Scan to join</div></div>
  </div>
  <script src="/qr.js"></script>
  <script src="/overlay/overlay.js"></script>
</body>
</html>
