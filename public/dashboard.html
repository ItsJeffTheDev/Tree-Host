<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tree Host</title>
  <link rel="icon" href="brand/tree-host-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="offline" class="offline hidden">Lost connection to the manager. Is the Tree Host window still open? Reconnecting...</div>

    <main id="main" class="main"></main>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts"></div>
  <script src="team.js"></script>
  <script src="extras.js"></script>

</html>
