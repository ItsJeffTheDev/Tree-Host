<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tree Host Help</title>
  <link rel="icon" href="brand/tree-host-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <style>
    body { overflow-y: auto; }
    :root { --z: 1; }
    .help { display: grid; grid-template-columns: 270px minmax(0, 1fr) 230px; min-height: calc(100vh / var(--z)); }

    /* ---- left navigation ---- */
    .help nav {
      background: var(--panel); border-right: 1px solid var(--border); padding: 18px 14px;
      display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: calc(100vh / var(--z)); overflow-y: auto;
    }
    .help nav .brand { margin-bottom: 14px; }
    .search { position: relative; margin-bottom: 12px; }
    .search input { padding-left: 32px; }
    .search::before { content: "<svg class="ic" aria-hidden="true"><use href="/icons.svg#search"/></svg>"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: .7; }
    .nav-group { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 14px 8px 4px; }
    .help nav a.doc {
      display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px;
      color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px;
    }
    .help nav a.doc:hover { background: var(--panel-2); }
    .help nav a.doc.active { background: rgba(70,195,123,.1); color: var(--accent); box-shadow: inset 3px 0 var(--accent); }
    .help nav a.doc .ico { width: 22px; text-align: center; }
    .help nav .back { margin-top: auto; }

    /* ---- search results ---- */
    #results { display: none; flex-direction: column; gap: 2px; margin-bottom: 8px; }
    #results.show { display: flex; }
    #results a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--text); font-size: 13px; }
    #results a:hover { background: var(--panel-2); }
    #results .r-doc { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
    #results .r-text { color: var(--muted); display: block; margin-top: 2px; line-height: 1.4; }
    #results mark { background: rgba(70,195,123,.3); color: var(--text); border-radius: 3px; padding: 0 2px; }
    #results .none { color: var(--muted); font-size: 13px; padding: 6px 10px; }

    /* ---- article ---- */
    main.content { min-width: 0; }
    article { max-width: 820px; margin: 0 auto; padding: 44px 48px 40px; line-height: 1.7; font-size: 15px; }
    article h1 { font-size: 34px; line-height: 1.2; margin: 0 0 14px; letter-spacing: -.3px; }
    article p.lead { font-size: 17px; color: #c4c9cf; margin-top: 0; }
    article h2 {
      font-size: 22px; margin: 44px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
      scroll-margin-top: 20px;
    }
    article h3 { font-size: 17px; margin: 28px 0 10px; scroll-margin-top: 20px; }
    article h4 { font-size: 15px; margin: 20px 0 6px; }
    article h2 a.anchor, article h3 a.anchor { opacity: 0; margin-left: 8px; color: var(--muted); text-decoration: none; font-weight: 400; }
    article h2:hover a.anchor, article h3:hover a.anchor { opacity: 1; }
    article p, article li { color: #d6dadf; }
    article a { color: #ffc93c; }
    article hr { display: none; }
    article code { font-size: 13px; background: #23272e; border: 1px solid var(--border); padding: 1px 6px; border-radius: 5px; color: #ffe08a; }
    .code-wrap { position: relative; margin: 14px 0; }
    .code-wrap pre {
      background: var(--console-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;
      overflow-x: auto; font: 13px/1.6 var(--mono); margin: 0;
    }
    .code-wrap pre code { background: none; border: none; padding: 0; color: #d6dadf; }
    .code-wrap .copy-btn { position: absolute; top: 8px; right: 8px; opacity: 0; transition: opacity .15s; }
    .code-wrap:hover .copy-btn { opacity: 1; }

    /* numbered steps */
    article ol { counter-reset: step; list-style: none; padding-left: 0; }
    article ol > li { counter-increment: step; position: relative; padding-left: 40px; margin: 10px 0; }
    article ol > li::before {
      content: counter(step); position: absolute; left: 0; top: 1px; width: 26px; height: 26px; border-radius: 50%;
      background: rgba(70,195,123,.15); color: var(--accent); font-weight: 700; font-size: 13px;
      display: grid; place-items: center; border: 1px solid rgba(70,195,123,.35);
    }
    article ul { padding-left: 22px; }
    article ul > li { margin: 6px 0; }
    article ul > li::marker { color: var(--accent); }

    /* tables */
    .table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); border-radius: 10px; }
    article table { width: 100%; border-collapse: collapse; font-size: 14px; }
    article th, article td { border: none; border-bottom: 1px solid var(--border); padding: 10px 14px; text-align: left; vertical-align: top; }
    article th { background: var(--panel-2); color: var(--text); font-size: 12.5px; text-transform: uppercase; letter-spacing: .4px; }
    article tr:last-child td { border-bottom: none; }
    article tbody tr:nth-child(even) td { background: rgba(255,255,255,.015); }
    article td.center, article th.center { text-align: center; }
    article td.center { font-size: 16px; color: #6fe0a5; }

    /* callouts */
    .callout { margin: 18px 0; padding: 14px 16px 14px 48px; border-radius: 10px; position: relative; border: 1px solid; }
    .callout p { margin: 0; }
    .callout::before { position: absolute; left: 16px; top: 13px; font-size: 18px; }
    .callout .c-label { font-weight: 700; margin-right: 4px; }
    .callout.note { background: rgba(74,158,255,.07); border-color: rgba(74,158,255,.3); }
    .callout.note::before { content: "ℹ️"; }
    .callout.note .c-label { color: #8cc2ff; }
    .callout.tip { background: rgba(52,199,123,.07); border-color: rgba(52,199,123,.3); }
    .callout.tip::before { content: "<svg class="ic" aria-hidden="true"><use href="/icons.svg#bulb"/></svg>"; }
    .callout.tip .c-label { color: #6fe0a5; }
    .callout.warn { background: rgba(70,195,123,.08); border-color: rgba(70,195,123,.4); }
    .callout.warn::before { content: "<svg class="ic" aria-hidden="true"><use href="/icons.svg#alert"/></svg>"; }
    .callout.warn .c-label { color: var(--accent); }

    /* prev / next */
    .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 820px; margin: 0 auto; padding: 0 48px 70px; }
    .pager a {
      display: block; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; text-decoration: none;
      color: var(--text); background: var(--panel);
    }
    .pager a:hover { border-color: var(--accent-dim); }
    .pager .p-label { font-size: 12px; color: var(--muted); }
    .pager .p-title { font-weight: 700; margin-top: 2px; }
    .pager .next { text-align: right; grid-column: 2; }

    /* right: on this page */
    aside.toc { position: sticky; top: 0; height: calc(100vh / var(--z)); overflow-y: auto; padding: 44px 18px 20px 0; }
    aside.toc .toc-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 8px; }
    aside.toc a { display: block; color: var(--muted); text-decoration: none; font-size: 13px; padding: 4px 0 4px 12px; border-left: 2px solid var(--border); }
    aside.toc a:hover { color: var(--text); }
    aside.toc a.on { color: var(--accent); border-left-color: var(--accent); }

    @media (max-width: 1200px) {
      .help { grid-template-columns: 250px minmax(0, 1fr); }
      aside.toc { display: none; }
    }
    @media (max-width: 800px) {
      .help { grid-template-columns: 1fr; }
      /* the guide list becomes compact chips so the guide itself starts near the top */
      .help nav { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
      #nav-links { display: flex; flex-wrap: wrap; gap: 6px; }
      .help nav .nav-group { display: none; }
      .help nav a.doc { padding: 6px 10px; border: 1px solid var(--border); border-radius: 999px; font-size: 13px; box-shadow: none !important; }
      .help nav .back { margin-top: 4px; }
      article { padding: 24px 16px 30px; }
      article h1 { font-size: 27px; }
      .pager { padding: 0 16px 50px; }
    }
    /* proportional scaling on big screens (same steps as the dashboard) */
    @media (min-width: 1800px) { :root { --z: 1.1; } body { zoom: 1.1; } }
    @media (min-width: 2300px) { :root { --z: 1.25; } body { zoom: 1.25; } }
    @media (min-width: 3000px) { :root { --z: 1.5; } body { zoom: 1.5; } }
  </style>
</head>
<body>
  <div class="help">
    <nav>
      <div class="brand"><div class="logo"></div><div><div class="brand-name">Tree Host</div><div class="brand-sub">Help &amp; guides</div></div></div>
      <div class="search"><input type="text" id="q" placeholder="Search the guides…" autocomplete="off"></div>
      <div id="results"></div>
      <div id="nav-links"></div>
      <a class="btn block back" href="/">← Back to the dashboard</a>
    </nav>
    <main class="content">
      <article id="doc">Loading...</article>
      <div class="pager" id="pager"></div>
    </main>
    <aside class="toc" id="toc"></aside>
  </div>
  <script src="/icons.js"></script>
  <script src="help.js"></script>
</body>
</html>
