name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Syntax-check the app
        run: npm run check

      - name: Smoke test (demo mode)
        run: |
          TREEHOST_PUBLIC_URL=http://localhost:8799 TREEHOST_PORT=8799 BILLING_DEMO=1 TREEHOST_DATA=$RUNNER_TEMP/th \
            node src/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8799/api/health && break; sleep 1; done
          for p in / /features /pricing /dashboard /api/plans /api/site; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8799$p)
            echo "$code $p"; [ "$code" = 200 ] || { cat server.log; exit 1; }
          done

      - name: Check the Discord bot
        working-directory: discord-bot
        run: |
          npm ci --no-fund --no-audit
          npm run check
